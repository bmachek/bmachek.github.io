name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://blog.fokuspunk.de';
          const key = 'fe796564a77dd5b1c2571bc44734331c';
          const sitemap = await fetch(origin + '/sitemap.xml', { signal: AbortSignal.timeout(30000) });
          if (!sitemap.ok) throw new Error('Sitemap HTTP ' + sitemap.status);
          const xml = await sitemap.text();
          const urls = [...new Set([...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]))]
            .filter(url => url.startsWith(origin + '/') && !url.endsWith('.xml'));
          if (!urls.length || urls.length > 10000) throw new Error('Unexpected sitemap URL count: ' + urls.length);
          const result = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ host: new URL(origin).host, key, keyLocation: origin + '/' + key + '.txt', urlList: urls }),
            signal: AbortSignal.timeout(30000)
          });
          if (![200, 202].includes(result.status)) throw new Error('IndexNow HTTP ' + result.status);
          console.log('IndexNow received ' + urls.length + ' page URLs (HTTP ' + result.status + ').');
          NODE
