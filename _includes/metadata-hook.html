<meta name="robots" content="index, follow, max-image-preview:large">

<!-- Custom design overrides -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{ 'assets/css/custom.css' | relative_url }}">

<!-- Person entity — site author (referenced by SoftwareApplication and BlogPosting pages) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ '/#person' | absolute_url }}",
      "name": "Bastian Machek",
      "alternateName": ["Fokuspunk", "bmachek"],
      "url": "{{ '/about-me/' | absolute_url }}",
      "image": "{{ '/img/avatar.jpg' | absolute_url }}",
      "description": "Photographer and open-source developer in the Landshut area of Germany. Creator of LrGeniusAI, MoodSwings, the Lightroom Immich Plugin and CIDP Buddy.",
      "sameAs": ["https://github.com/bmachek", "https://www.instagram.com/fokuspunk/", "https://www.fokuspunk.de"]
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/#website' | absolute_url }}",
      "url": "{{ '/' | absolute_url }}",
      "name": "Bastian Machek / Fokuspunk",
      "alternateName": "Fokuspunk",
      "publisher": {"@id": "{{ '/#person' | absolute_url }}"},
      "inLanguage": {{ site.lang | jsonify }}
    },
    {
      "@type": {% if page.url == '/about-me/' %}"ProfilePage"{% else %}"WebPage"{% endif %},
      "@id": "{{ page.url | absolute_url }}#webpage",
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "isPartOf": {"@id": "{{ '/#website' | absolute_url }}"},
      "author": {"@id": "{{ '/#person' | absolute_url }}"},
      "inLanguage": {{ page.lang | default: site.lang | jsonify }}
      {% if page.url == '/about-me/' or page.url == '/' %},
      "mainEntity": {"@id": "{{ '/#person' | absolute_url }}"}
      {% elsif page.project_schema %},
      "mainEntity": {"@id": "{{ page.url | absolute_url }}#software"}
      {% endif %}
    }
  ]
}
</script>

{% if page.project_schema %}
{% assign project = site.data.projects[page.project_schema] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": {{ project.type | default: 'SoftwareApplication' | jsonify }},
  "@id": "{{ page.url | absolute_url }}#software",
  "name": {{ project.name | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "author": {"@id": "{{ '/#person' | absolute_url }}"},
  "mainEntityOfPage": {"@id": "{{ page.url | absolute_url }}#webpage"},
  "subjectOf": {"@type": "SoftwareSourceCode", "codeRepository": {{ project.repository | jsonify }}}
  {% if project.category %},"applicationCategory": {{ project.category | jsonify }}{% endif %}
  {% if project.os %},"operatingSystem": {{ project.os | jsonify }}{% endif %}
  {% if project.license %},"license": {{ project.license | jsonify }}{% endif %}
  {% if project.download %},"downloadUrl": {{ project.download | jsonify }}{% endif %}
  {% if project.website %},"sameAs": {{ project.website | jsonify }}{% endif %}
  {% if page.image %},"image": {{ page.image | absolute_url | jsonify }}{% endif %}
}
</script>
{% endif %}

{% if page.howto %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"HowTo","name":{{ page.howto.name | jsonify }},"description":{{ page.description | jsonify }},"step":[{% for step in page.howto.steps %}{"@type":"HowToStep","name":{{ step.name | jsonify }},"text":{{ step.text | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
</script>
{% endif %}

{% if page.faq %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for item in page.faq %}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
</script>
{% endif %}

{% if jekyll.environment == 'production' %}
<style>
#cm-banner{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:var(--bm-bg-elevated,#161b22);border-top:1px solid var(--bm-border,#30363d);color:var(--bm-text,#e6edf3);font-family:var(--bm-font-mono,"JetBrains Mono",monospace);font-size:.85rem;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
#cm-banner p{margin:0;flex:1;min-width:200px}
#cm-banner .cm-btns{display:flex;gap:.5rem;flex-shrink:0}
#cm-banner button{border:1px solid var(--bm-border,#30363d);background:var(--bm-bg,#0d1117);color:var(--bm-text,#e6edf3);font-family:inherit;font-size:.82rem;padding:.35rem .85rem;border-radius:4px;cursor:pointer;transition:filter .15s}
#cm-banner #cm-accept{background:var(--bm-accent,#7ee787);border-color:var(--bm-accent,#7ee787);color:#0d1117}
#cm-banner button:hover{filter:brightness(1.12)}
</style>
<script>
(function(){
  var KEY='analytics_consent';
  var GA='{{ site.analytics.google.id }}';

  function loadGA(){
    if(!GA)return;
    var s=document.createElement('script');
    s.defer=true;s.src='https://www.googletagmanager.com/gtag/js?id='+GA;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    window.gtag=gtag;
    gtag('js',new Date());gtag('config',GA);
  }

  var consent=localStorage.getItem(KEY);
  if(consent==='granted'){
    loadGA();
  } else if(!consent){
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.createElement('div');
      b.id='cm-banner';
      b.innerHTML='<p>This site uses Google Analytics to understand how visitors use it. No personal data is sold.</p><div class="cm-btns"><button id="cm-decline">Decline</button><button id="cm-accept">Accept</button></div>';
      document.body.appendChild(b);
      document.getElementById('cm-accept').onclick=function(){
        localStorage.setItem(KEY,'granted');b.remove();loadGA();
      };
      document.getElementById('cm-decline').onclick=function(){
        localStorage.setItem(KEY,'denied');b.remove();
      };
    });
  }
})();
</script>
{% endif %}
